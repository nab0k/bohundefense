name: Automatic Synthesis Feed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-synthesis-feed.yml'
      - 'scripts/update-synthesis-feed.py'
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-wire-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export owner-approved syntheses
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_NoUH4O8mod-tbyr5yGdFBw_-zF3X5tr
          SUPABASE_URL: https://tecrucawzukxqtchpxrh.supabase.co
        run: python scripts/update-synthesis-feed.py
      - name: Commit only changed synthesis feed
        run: |
          if git diff --quiet -- feed/synthesis-feed.json && git ls-files --error-unmatch feed/synthesis-feed.json >/dev/null 2>&1; then
            echo "No synthesis changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/synthesis-feed.json
          git commit -m "chore(feed): refresh approved syntheses"
          git push origin HEAD:main
