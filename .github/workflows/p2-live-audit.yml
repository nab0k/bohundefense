name: P2 Live Intelligence Map Global Coverage (READ ONLY)
on:
  push:
    branches: [p2-live-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit actual production domain desktop and mobile
        env:
          P2_AUDIT_URL: https://bohundefence.com/
        run: node scripts/p2-site-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-live-global-coverage-screenshots
          path: output/p2/
          retention-days: 30
