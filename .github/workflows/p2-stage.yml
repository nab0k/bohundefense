name: P2 stage branded site (NO PUBLIC DEPLOY)
on:
  push:
    branches: [p2-live-review]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-live-stage
          path: staged
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: nab0k/bohun-the-field
          ref: 9c99241af005b55fb173272ef253cc33ea72e586
          path: atlas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run original source tests and build
        working-directory: atlas
        run: |
          npm ci
          npm test
          node scripts/test-m1-state.mjs
          npm run build:site
        env:
          SITE_BASE: /
      - name: Preserve old page and original logo, stage new site
        run: |
          test -s staged/CNAME
          grep -Fxq bohundefence.com staged/CNAME
          test -s staged/logo_gold.png
          test -s staged/legacy/index.html
          cp -a atlas/dist/. staged/
          test -s staged/index.html
          test -s staged/logo_gold.png
          test -s staged/atlas/companies-at.json
          printf 'bohundefence.com\n' > staged/CNAME
          grep -q 'Bohun Defence' staged/index.html
      - name: Commit isolated stage (main never touched)
        working-directory: staged
        run: |
          git config user.name 'bohundefence-p1-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'P2: restore Bohun brand and intelligent night zoom on original atlas'
          git push origin HEAD:p2-live-stage
      - name: Artifact of staged domain files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-domain-staging
          path: |
            staged/index.html
            staged/CNAME
            staged/logo_gold.png
            staged/legacy/index.html
          retention-days: 30
