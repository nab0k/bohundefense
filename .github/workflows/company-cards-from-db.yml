name: Company cards from the database

# B4CE-04 step 3.5 (EXP-033). Started by the FIELD autofill after it writes cards (and daily as a fallback).
# Since 23.11.2026 the FIELD job sends the newest cards with the dispatch (input cards_gz_b64, gzip + base64), so
# this repository needs no database key; without the input it falls back to the database RPC if a key is set.
# Adds new auto-written cards to the site files and opens a pull request; the owner releases by command
# (decision 21.11.2026). Existing profiles are never replaced. The key is never printed.
on:
  workflow_dispatch:
    inputs:
      cards_gz_b64:
        description: 'Cards from the FIELD autofill (gzip + base64 JSON); empty = read the database'
        default: ''
      publish:
        description: 'Publish on main at once (D-20261123-COMPANY-CARDS-AUTOPUBLISH); false = pull request'
        default: 'false'
      then_feed:
        description: 'Refresh the synthesis feed after the cards (so new texts link to them)'
        default: 'false'
  schedule:
    - cron: '50 4 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: source-wire-refresh  # shared with the feed job: both push to main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip while a previous pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --search "head:auto/company-cards" --json number -q 'length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "An auto/company-cards pull request is open; it is updated after release"; fi
      - name: Build cards
        id: cards
        if: steps.open.outputs.count == '0' || github.event.inputs.publish == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDS: ${{ github.event.inputs.cards_gz_b64 }}
        run: |
          if [ -n "$CARDS" ]; then
            printf '%s' "$CARDS" | base64 -d | gunzip > "$RUNNER_TEMP/cards.json"
            python scripts/company-cards-from-db.py "$RUNNER_TEMP/cards.json"
          else
            python scripts/company-cards-from-db.py
          fi
      - name: Check the written files
        if: steps.cards.outputs.added != '' && steps.cards.outputs.added != '0'
        run: |
          python -c "import json; [json.load(open(f)) for f in ('atlas/company-profiles-v1.json','atlas/companies-directory-v1.json','atlas/company-country-groups.geojson')]; print('json ok')"
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Publish on main (automatic, owner 23.11.2026)
        if: success() && github.event.inputs.publish == 'true' && steps.cards.outputs.added != '' && steps.cards.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/company-profiles-v1.json atlas/companies-directory-v1.json atlas/company-country-groups.geojson
          git commit -m "data(companies): cards and news companies, published automatically (D-20261123-COMPANY-CARDS-AUTOPUBLISH)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Refresh the feed after the cards
        if: always() && github.event.inputs.then_feed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run automatic-synthesis-feed.yml --ref main || echo "feed refresh not started; the feed schedule stays"
      - name: Pull request
        if: github.event.inputs.publish != 'true' && steps.cards.outputs.added != '' && steps.cards.outputs.added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="auto/company-cards-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add atlas/company-profiles-v1.json atlas/companies-directory-v1.json atlas/company-country-groups.geojson
          git commit -m "data(companies): cards from the database autofill"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Company cards from autofill ($(date -u +%d.%m.%Y))" --body-file company-cards-summary.md \
            || echo "Branch $branch pushed; opening a pull request from Actions is not allowed in this repository"
