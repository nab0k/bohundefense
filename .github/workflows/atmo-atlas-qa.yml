name: Atmosphere 2.2 isolated Atlas QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/atmosphere-22-company-research
      - feature/atmosphere-22-reference-fidelity
    paths:
      - 'index.html'
      - 'company-profile.html'
      - 'assets/atmo-*.css'
      - 'assets/atmo-*.js'
      - 'scripts/atmo-browser-smoke.py'
      - '.github/workflows/atmo-atlas-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new JS syntax
        run: |
          node --check assets/atmo-atlas.js
          node --check assets/atmo-company-entry.js
          node --check assets/atmo-company-profile.js
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test live Atlas DOM and company profile against published JSON
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atmo-http.log 2>&1 &
          python scripts/atmo-browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmosphere-22-browser-screenshots
          path: /tmp/atmo-*.png
          retention-days: 7
