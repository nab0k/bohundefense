name: Automatic Inoreader Source Wire
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-inoreader-wire.yml'
      - 'scripts/update-source-wire.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-wire-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export attributed source headlines
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tecrucawzukxqtchpxrh.supabase.co
        run: python scripts/update-source-wire.py
      - name: Commit only changed public feed
        run: |
          if git diff --quiet -- feed/inoreader-source-wire.json; then
            echo "No new headlines"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/inoreader-source-wire.json
          git commit -m "chore(feed): refresh attributed Inoreader headlines"
          git push origin HEAD:main
