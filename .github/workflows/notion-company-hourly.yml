name: BOHUN Companies | Notion → DB → site
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/notion-company-hourly.yml'
      - 'scripts/sync-notion-companies.py'
      - 'scripts/build-company-publication.py'
      - 'scripts/validate-company-publication.py'
      - 'tests/test_company_sync.py'
  schedule:
    - cron: '13 * * * *'  # every hour, less congested than minute 0
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: notion-companies-hourly
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline company-sync tests (no external credentials)
        run: python -m unittest discover -s tests -p 'test_company_sync.py' -v
  refresh:
    # A manually dispatched run on an unmerged review branch must never write to Supabase or main.
    # Explicit activation only after credentials and GitHub Pages deployment are verified.
    if: github.ref == 'refs/heads/main' && vars.BOHUN_COMPANIES_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      expected_sha256: ${{ steps.commit.outputs.expected_sha256 }}
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code before touching data
        run: python -m unittest discover -s tests -p 'test_company_sync.py' -v
      - name: Install the PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Verify secrets exist (never print them)
        env:
          NOTION_TOKEN: ${{ secrets.BOHUN_NOTION_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.BOHUN_SUPABASE_DB_URL }}
        run: |
          test -n "$NOTION_TOKEN" || { echo 'Missing BOHUN_NOTION_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo 'Missing BOHUN_SUPABASE_DB_URL'; exit 1; }
      - name: Preserve previous catalogue for regression check
        run: cp atlas/companies-directory-v1.json "$RUNNER_TEMP/companies-previous.json"
      - name: Sync every Notion database property into private Supabase cache
        env:
          NOTION_TOKEN: ${{ secrets.BOHUN_NOTION_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.BOHUN_SUPABASE_DB_URL }}
          NOTION_DATA_SOURCE_ID: ec8c6312-3bfc-48e8-9a27-3c5827e72fda
        run: |
          python scripts/sync-notion-companies.py --min-records 3000 \
            --output "$RUNNER_TEMP/notion-companies-snapshot.json"
      - name: Build public directory and country groups
        run: python scripts/build-company-publication.py "$RUNNER_TEMP/notion-companies-snapshot.json"
      - name: Validate before publishing
        run: |
          python scripts/validate-company-publication.py \
            --previous "$RUNNER_TEMP/companies-previous.json"
      - name: Commit verified public data only
        id: commit
        run: |
          if git diff --quiet -- atlas/companies-directory-v1.json atlas/company-country-groups.geojson; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'NO_CHANGE: public data already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas/companies-directory-v1.json atlas/company-country-groups.geojson
          git commit -m 'chore(companies): hourly verified Notion snapshot publication'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "expected_sha256=$(sha256sum atlas/companies-directory-v1.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages (requires Actions publishing source)
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload deployment artifact after successful commit
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the updated static site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the live website serves exactly the deployed directory
        env:
          EXPECTED_SHA256: ${{ needs.refresh.outputs.expected_sha256 }}
        run: python scripts/verify-live-companies.py --expected-sha256 "$EXPECTED_SHA256"
