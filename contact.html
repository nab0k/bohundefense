  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Research navigation"></aside>
    <div class="main">
      <header id="topbar" class="shell-top"></header>
      <main id="content" tabindex="-1"><div class="info-wrap">
<p class="info-eyebrow">Contact</p>
<h1>Discuss a project</h1>
<p class="lead">Tell us briefly what you want to achieve. Please do not send classified, export-controlled, operationally sensitive or otherwise restricted information.</p>
<section class="info-card"><form id="enquiry" class="info-form" action="https://formspree.io/f/xbdwvgqp" method="POST">
<label>Topic<select name="topic"><option>Buyers and new business</option><option>Suppliers and qualification</option><option>Technology partnerships</option><option>Private investment</option><option>Something else</option></select></label>
<label>Name<input name="name" required autocomplete="name"></label>
<label>Organisation<input name="organisation" required autocomplete="organization"></label>
<label>Work email<input name="email" type="email" required autocomplete="email"></label>
<label>Your objective<textarea name="message" rows="5" required></textarea></label>
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<button class="info-cta" type="submit">Send enquiry</button>
<p id="enquiry-status" class="info-note" role="status"></p>
</form></section>
<p class="info-note">You can also write directly to <a href="mailto:nabok@bohundefence.com">nabok@bohundefence.com</a>. <a href="/privacy.html">Privacy notice</a>.</p>
      </div></main>
    </div>
  </div>
